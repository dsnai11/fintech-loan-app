name: Deploy Web Portal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy Web Portal to Production
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy Web Portal to Railway
      run: |
        echo "Web portal files ready at: ./web-portal/"
        echo "Contains: index.html, server.js"
        echo "Connects to: https://fintech-loan-app-production.up.railway.app/api"
        ls -la web-portal/

    - name: Build Web Portal for Static Deploy
      run: |
        mkdir -p web-dist
        cp web-portal/index.html web-dist/
        echo "Web portal built successfully"

    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-web-portal
        path: web-dist/

  build-mobile:
    name: Build Mobile Apps (APK & IPA)
    runs-on: ubuntu-latest
    needs: deploy-web

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build APK
      run: cd mobile && flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-apk
        path: |
          mobile/build/app/outputs/flutter-apk/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: warn

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: deploy-web

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build iOS
      run: cd mobile && flutter build ios --release --no-codesign

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r mobile/build/ios/iphoneos/Runner.app Payload/
        zip -r FintechLoan.ipa Payload/

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-ipa
        path: FintechLoan.ipa
        if-no-files-found: warn
