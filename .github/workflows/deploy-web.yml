name: Deploy Web Portal

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy Web Portal to Production
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy Web Portal to Railway
      run: |
        echo "Web portal files ready at: ./web-portal/"
        echo "Contains: index.html, server.js"
        echo "Connects to: https://fintech-loan-app-production.up.railway.app/api"
        ls -la web-portal/

    - name: Build Web Portal for Static Deploy
      run: |
        mkdir -p web-dist
        cp web-portal/index.html web-dist/
        echo "Web portal built successfully"

    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-web-portal
        path: web-dist/

