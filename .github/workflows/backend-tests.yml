name: Backend tests

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', 'web-portal/**', '.github/workflows/backend-tests.yml' ]
  pull_request:
    paths: [ 'backend/**', 'web-portal/**', '.github/workflows/backend-tests.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API tests (Node 20, MongoDB 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TEST_MONGO_URL: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Portal copy in backend/public is up to date
        working-directory: backend
        run: |
          npm run sync-portal
          git diff --exit-code -- public || (echo "backend/public is out of date. Run 'npm run sync-portal' in backend and commit." && exit 1)

      - name: Run tests
        working-directory: backend
        run: npm test
