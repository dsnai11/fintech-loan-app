name: Build APK & IPA & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
        echo "flutter.versionCode=1" >> mobile/android/local.properties
        echo "flutter.versionName=1.0" >> mobile/android/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> mobile/android/local.properties

    - name: Fix gradlew permissions
      run: |
        sed -i 's/\r$//' mobile/android/gradlew
        chmod +x mobile/android/gradlew

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build APK
      run: cd mobile && flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-apk
        path: |
          mobile/build/app/outputs/flutter-apk/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Create iOS platform files
      run: |
        cd mobile
        flutter create --platforms ios . --project-name fintech_loan
        echo "iOS directory created"
        # The selfie step uses the camera, and iOS stops the app without a reason to show the customer.
        /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'LIFC uses the camera to take your selfie and check that it is really you.'" ios/Runner/Info.plist
        /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'LIFC needs access to photos only if you choose to upload a document.'" ios/Runner/Info.plist || true

    - name: Build iOS (no codesign)
      run: |
        cd mobile
        flutter build ios --release --no-codesign

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r mobile/build/ios/iphoneos/Runner.app Payload/
        zip -r FintechLoan.ipa Payload/
        echo "IPA created: $(du -sh FintechLoan.ipa | cut -f1)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-ipa
        path: FintechLoan.ipa

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build Web
      run: cd mobile && flutter build web --release

    - name: Upload Web
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-web
        path: mobile/build/web/
