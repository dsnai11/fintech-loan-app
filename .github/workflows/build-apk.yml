name: Build APK & Web

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: |
        cd mobile
        flutter pub get

    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
        echo "flutter.versionCode=1" >> mobile/android/local.properties
        echo "flutter.versionName=1.0" >> mobile/android/local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" >> mobile/android/local.properties

    - name: Build APK
      run: |
        cd mobile
        flutter build apk --release --verbose
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Find APK
      run: find mobile/build -name "*.apk" 2>/dev/null || echo "No APK found"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-app
        path: |
          mobile/build/app/outputs/flutter-apk/release/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: warn

    - name: Build Web
      run: |
        cd mobile
        flutter build web --release

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-release
        path: mobile/build/web/
