name: Build APK & IPA & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Java
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
        echo "flutter.versionCode=1" >> mobile/android/local.properties
        echo "flutter.versionName=1.0" >> mobile/android/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> mobile/android/local.properties

    - name: Fix gradlew permissions
      run: |
        sed -i 's/\r$//' mobile/android/gradlew
        chmod +x mobile/android/gradlew

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build APK
      run: |
        cd mobile
        set +e
        flutter build apk --release 2>&1 | tee ../apk-build.log
        code=${PIPESTATUS[0]}
        # Show what went wrong as annotations so it is easy to find from the run summary
        grep -E "What went wrong|error:|Execution failed|Could not|Caused by|> \S|FAILURE|e: |wrong" ../apk-build.log | head -25 | while read -r line; do echo "::error::${line:0:300}"; done
        exit $code

    - name: Upload APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fintech-loan-apk
        path: |
          mobile/build/app/outputs/flutter-apk/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Leave the Firebase push plugin out of the iPhone build
      run: |
        # It cannot share an iPhone build with the face-detection library yet, and an unsigned iPhone build cannot get pushes.
        cd mobile
        sed -i '' '/^  firebase_core:/d;/^  firebase_messaging:/d' pubspec.yaml
        cp lib/services/push_service_stub.dart lib/services/push_service.dart
        grep -c firebase pubspec.yaml || true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Create iOS platform files
      run: |
        cd mobile
        flutter create --platforms ios . --project-name fintech_loan
        echo "iOS directory created"
        # The selfie step uses the camera, and iOS stops the app without a reason to show the customer.
        /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'LIFC uses the camera to take your selfie and check that it is really you.'" ios/Runner/Info.plist
        /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'LIFC uses your location when you apply, to keep your account safe and prevent fraud.'" ios/Runner/Info.plist || true
        /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'LIFC needs access to photos only if you choose to upload a document.'" ios/Runner/Info.plist || true
        # Face ID to unlock the app
        /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'LIFC uses Face ID to unlock the app, so only you can open your loans.'" ios/Runner/Info.plist || true

    - name: Build iOS (no codesign)
      run: |
        cd mobile
        set +e
        flutter build ios --release --no-codesign 2>&1 | tee ../ios-build.log
        code=${PIPESTATUS[0]}
        # Show what went wrong as annotations so it is easy to find from the run summary
        { grep -v "/opt/homebrew" ../ios-build.log | grep -iE "error|could not find|compatible|required by|depends on|In Podfile|Specs satisfying|conflict|CDN|master" | head -25; grep -v "/opt/homebrew" ../ios-build.log | tail -n 20; } | while read -r line; do echo "::error::${line:0:300}"; done
        exit $code

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r mobile/build/ios/iphoneos/Runner.app Payload/
        zip -r FintechLoan.ipa Payload/
        echo "IPA created: $(du -sh FintechLoan.ipa | cut -f1)"

    - name: Upload IPA
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fintech-loan-ipa
        path: FintechLoan.ipa

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    # The finished web app is saved back into the repository (backend/public/app), where the server picks it up
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build Web
      # Served at /app/ by the backend. No service worker (so a new release shows at once), and the drawing engine is bundled
      # instead of fetched from Google (so the server's content policy can stay strict).
      run: cd mobile && flutter build web --release --base-href /app/ --pwa-strategy=none --no-web-resources-cdn

    - name: Save the web app into the backend (needs GitHub Actions to have write permission on the repository)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
      run: |
        rm -rf backend/public/app
        mkdir -p backend/public/app
        cp -r mobile/build/web/. backend/public/app/
        git config user.name "LIFC build"
        git config user.email "build@lifc.in"
        git add -A backend/public/app
        git status --short | head -5
        if git diff --cached --quiet; then
          echo "::notice::The web app did not change, or its files were not added."
        else
          git commit -m "Web app build [skip ci]"
          # Show the reason in the run summary if saving fails (most often: Actions has no write permission on the repository)
          if ! (git pull --rebase --autostash origin main && git push origin HEAD:main) 2>&1 | tee push.log; then :; fi
          if [ "${PIPESTATUS[0]}" != "0" ] || grep -qiE "fatal|denied|error" push.log; then
            while read -r line; do echo "::error::${line:0:300}"; done < <(tail -n 6 push.log)
            exit 1
          fi
        fi

    - name: Upload Web
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fintech-loan-web
        path: mobile/build/web/
