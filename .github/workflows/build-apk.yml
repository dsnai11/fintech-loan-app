name: Build APK & Web

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
        echo "flutter.versionCode=1" >> mobile/android/local.properties
        echo "flutter.versionName=1.0" >> mobile/android/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> mobile/android/local.properties

    - name: Fix gradlew line endings and make executable
      run: |
        sed -i 's/\r$//' mobile/android/gradlew
        chmod +x mobile/android/gradlew
        head -1 mobile/android/gradlew

    - name: Get dependencies
      run: |
        cd mobile
        flutter pub get

    - name: Build APK
      run: |
        cd mobile
        flutter build apk --release

    - name: Find APK location
      if: always()
      run: |
        echo "=== Searching for APK ==="
        find mobile/build -name "*.apk" 2>/dev/null || echo "No APK found"
        echo "=== Build output structure ==="
        find mobile/build/app/outputs -type f 2>/dev/null | head -20 || echo "No outputs dir"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-apk
        path: |
          mobile/build/app/outputs/flutter-apk/release/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: warn

    - name: Build Web
      run: |
        cd mobile
        flutter build web --release

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-web
        path: mobile/build/web/
