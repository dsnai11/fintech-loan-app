name: Build APK & IPA & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
        echo "flutter.versionCode=1" >> mobile/android/local.properties
        echo "flutter.versionName=1.0" >> mobile/android/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> mobile/android/local.properties

    - name: Fix gradlew permissions
      run: |
        sed -i 's/\r$//' mobile/android/gradlew
        chmod +x mobile/android/gradlew

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build APK
      run: |
        cd mobile
        set +e
        flutter build apk --release 2>&1 | tee ../apk-build.log
        code=${PIPESTATUS[0]}
        # Show what went wrong as annotations so it is easy to find from the run summary
        grep -E "What went wrong|error:|Execution failed|Could not|Caused by|> \S|FAILURE|e: |wrong" ../apk-build.log | head -25 | while read -r line; do echo "::error::${line:0:300}"; done
        exit $code

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-apk
        path: |
          mobile/build/app/outputs/flutter-apk/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Create iOS platform files
      run: |
        cd mobile
        flutter create --platforms ios . --project-name fintech_loan
        echo "iOS directory created"
        # The selfie step uses the camera, and iOS stops the app without a reason to show the customer.
        /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'LIFC uses the camera to take your selfie and check that it is really you.'" ios/Runner/Info.plist
        /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'LIFC needs access to photos only if you choose to upload a document.'" ios/Runner/Info.plist || true
        # The Firebase push plugin does not build on the current Xcode unless non-modular includes are allowed
        python3 - <<'PYEOF'
        p = 'ios/Podfile'
        s = open(p).read()
        marker = 'flutter_additional_ios_build_settings(target)'
        fix = marker + chr(10) + "    target.build_configurations.each { |c| c.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES' }"
        assert marker in s, 'Podfile layout changed'
        open(p, 'w').write(s.replace(marker, fix, 1))
        PYEOF

    - name: Build iOS (no codesign)
      run: |
        cd mobile
        set +e
        flutter build ios --release --no-codesign 2>&1 | tee ../ios-build.log
        code=${PIPESTATUS[0]}
        # Show what went wrong as annotations so it is easy to find from the run summary
        { grep -iE "error|warning: .*deployment|requires|incompatible|unsupported|not found" ../ios-build.log | grep -v "^warning:" | head -25; tail -n 25 ../ios-build.log; } | while read -r line; do echo "::error::${line:0:300}"; done
        exit $code

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r mobile/build/ios/iphoneos/Runner.app Payload/
        zip -r FintechLoan.ipa Payload/
        echo "IPA created: $(du -sh FintechLoan.ipa | cut -f1)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-ipa
        path: FintechLoan.ipa

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build Web
      run: cd mobile && flutter build web --release

    - name: Upload Web
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-web
        path: mobile/build/web/
