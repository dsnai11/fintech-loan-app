name: Build APK & IPA & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create local.properties
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > mobile/android/local.properties
        echo "flutter.versionCode=1" >> mobile/android/local.properties
        echo "flutter.versionName=1.0" >> mobile/android/local.properties
        echo "sdk.dir=$ANDROID_HOME" >> mobile/android/local.properties

    - name: Fix gradlew permissions
      run: |
        sed -i 's/\r$//' mobile/android/gradlew
        chmod +x mobile/android/gradlew

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build APK
      run: |
        cd mobile
        set +e
        flutter build apk --release 2>&1 | tee ../apk-build.log
        code=${PIPESTATUS[0]}
        # Show what went wrong as annotations so it is easy to find from the run summary
        grep -E "What went wrong|error:|Execution failed|Could not|Caused by|> \S|FAILURE|e: |wrong" ../apk-build.log | head -25 | while read -r line; do echo "::error::${line:0:300}"; done
        exit $code

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-apk
        path: |
          mobile/build/app/outputs/flutter-apk/app-release.apk
          mobile/build/app/outputs/apk/release/app-release.apk
        if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Create iOS platform files
      run: |
        cd mobile
        flutter create --platforms ios . --project-name fintech_loan
        echo "iOS directory created"
        # The selfie step uses the camera, and iOS stops the app without a reason to show the customer.
        /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'LIFC uses the camera to take your selfie and check that it is really you.'" ios/Runner/Info.plist
        /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'LIFC needs access to photos only if you choose to upload a document.'" ios/Runner/Info.plist || true
        # The Firebase push plugin needs iOS 13 or newer (flutter create defaults to 12)
        python3 - <<'PYEOF'
        import re
        def edit(path, fn):
            s = open(path).read()
            t = fn(s)
            assert t != s, 'nothing changed in ' + path
            open(path, 'w').write(t)
        edit('ios/Podfile', lambda s: re.sub(r"#?\s*platform :ios, '[0-9.]+'", "platform :ios, '13.0'", s, count=1))
        edit('ios/Runner.xcodeproj/project.pbxproj', lambda s: re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 13.0;', s))
        edit('ios/Flutter/AppFrameworkInfo.plist', lambda s: re.sub(r'(<key>MinimumOSVersion</key>\s*<string>)[0-9.]+(</string>)', r'\g<1>13.0\g<2>', s))
        PYEOF

    - name: Build iOS (no codesign)
      run: |
        cd mobile
        set +e
        flutter build ios --release --no-codesign 2>&1 | tee ../ios-build.log
        code=${PIPESTATUS[0]}
        # Show what went wrong as annotations so it is easy to find from the run summary
        { grep -v "/opt/homebrew" ../ios-build.log | grep -iE "error|could not find|compatible|required by|depends on|In Podfile|Specs satisfying|conflict|CDN|master" | head -25; grep -v "/opt/homebrew" ../ios-build.log | tail -n 20; } | while read -r line; do echo "::error::${line:0:300}"; done
        exit $code

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r mobile/build/ios/iphoneos/Runner.app Payload/
        zip -r FintechLoan.ipa Payload/
        echo "IPA created: $(du -sh FintechLoan.ipa | cut -f1)"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-ipa
        path: FintechLoan.ipa

  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: cd mobile && flutter pub get

    - name: Build Web
      run: cd mobile && flutter build web --release

    - name: Upload Web
      uses: actions/upload-artifact@v4
      with:
        name: fintech-loan-web
        path: mobile/build/web/
