<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - LIFC Admin</title>
<style>
* { box-sizing: border-box; }
.alert { display: none; padding: 12px 16px; margin-bottom: 14px; white-space: pre-line; }
.alert.show { display: block; }
.card { padding: 16px; margin-bottom: 14px; }
.sub { font-size: 12px; color: var(--e-muted); margin-bottom: 12px; line-height: 1.5; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--e-border); background: var(--e-surface); border-radius: 99px; padding: 5px 12px; font: 600 12px var(--e-font); cursor: pointer; color: var(--e-text-2); }
.chip.on { background: var(--e-primary-soft); border-color: var(--e-primary); color: var(--e-primary); }
.list { max-height: 70vh; overflow-y: auto; }
.row { padding: 10px 12px; border: 1px solid var(--e-border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--e-surface); }
.row:hover { border-color: var(--e-muted); }
.row.on { border-color: var(--e-primary); background: var(--e-primary-soft); }
.row b { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.row .pv { font-size: 12px; color: var(--e-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 11px; color: var(--e-muted); margin-top: 3px; }
.dot { display: inline-block; min-width: 18px; height: 18px; border-radius: 99px; background: var(--e-primary); color: #fff; font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; padding: 0 5px; }
.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; padding: 4px 2px 10px; }
.m { max-width: 78%; padding: 8px 12px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.m small { display: block; font-size: 11px; opacity: .7; margin-top: 3px; }
.m.customer { align-self: flex-start; background: var(--e-surface-2); border: 1px solid var(--e-border); }
.m.staff { align-self: flex-end; background: var(--e-primary); color: #fff; }
.reply { display: flex; gap: 8px; margin-top: 8px; }
.reply textarea { flex: 1; min-height: 64px; resize: vertical; width: 100%; }
.head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.head h2 { margin: 0; font-size: 15px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
.grid input, .grid select, .grid textarea { width: 100%; }
.empty { color: var(--e-muted); padding: 24px; text-align: center; font-size: 13px; }
</style>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-shell="app" data-title="Messages" data-sub="Talk to customers one to one, or send an announcement to a group.">
<div class="container">
  <div id="alert" class="alert" role="alert"></div>
  <div class="tabs" id="tabs">
    <button id="tab-inbox" class="on" onclick="showTab('inbox')">Inbox</button>
    <button id="tab-ann" onclick="showTab('ann')">Announcements</button>
  </div>

  <div id="view-inbox">
    <div class="layout">
      <div class="card">
        <div class="filters" id="filters"></div>
        <div class="list" id="list"></div>
      </div>
      <div class="card" id="thread"><div class="empty">Pick a conversation to read it.</div></div>
    </div>
  </div>

  <div id="view-ann" style="display:none">
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:15px">Send an announcement</h2>
      <div class="sub">It appears in the in-app notifications of everyone in the group you choose. Check the number before you send.</div>
      <div class="grid">
        <div><label for="a-aud">Who should get it</label><select id="a-aud" onchange="countAudience()"></select><div class="sub" id="a-count" style="margin:4px 0 0"></div></div>
        <div><label for="a-title">Title (up to 80 characters)</label><input id="a-title" maxlength="80"></div>
      </div>
      <label for="a-msg">Message (up to 500 characters)</label>
      <textarea id="a-msg" maxlength="500" style="width:100%;min-height:80px;margin-bottom:10px"></textarea>
      <label class="chk" id="a-push-row" style="display:none;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" id="a-push" checked> <span>Also send as a push notification to phones <span class="sub" id="a-devices" style="margin:0"></span></span></label>
      <button class="btn primary" onclick="sendAnnouncement()">Send announcement</button>
    </div>
    <div class="card"><h2 style="margin:0 0 10px;font-size:15px">Sent so far</h2>
      <div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Title</th><th>Group</th><th>People</th><th>Sent by</th></tr></thead><tbody id="a-rows"></tbody></table></div>
    </div>
  </div>
</div>

<script>
const API = (location.protocol === 'file:' ? 'https://fintech-loan-app-production.up.railway.app' : location.port === '3000' ? 'http://localhost:5000' : location.origin) + '/api';
const token = localStorage.getItem('admin_token');
if (!token) location.href = 'admin-config.html';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = d => new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const VIEWS = [['waiting', 'Waiting for reply'], ['mine', 'Mine'], ['unassigned', 'Unassigned'], ['open', 'All open'], ['closed', 'Closed']];
let view = 'waiting', current = null, counts = {};

function msg(text, kind) {
  const a = $('alert'); a.textContent = text; a.className = 'alert show ' + (kind === 'ok' ? 'ok' : 'err');
  if (kind === 'ok') setTimeout(() => a.classList.remove('show'), 4000);
}
async function api(path, method = 'GET', body) {
  const r = await fetch(API + path, { method, headers: { Authorization: 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { localStorage.removeItem('admin_token'); location.href = 'admin-config.html'; throw new Error('Session expired'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Something went wrong'), { data: d });
  return d;
}
const can = p => !window.PortalShell || PortalShell.can(p);

function showTab(t) {
  $('view-inbox').style.display = t === 'inbox' ? '' : 'none';
  $('view-ann').style.display = t === 'ann' ? '' : 'none';
  $('tab-inbox').classList.toggle('on', t === 'inbox');
  $('tab-ann').classList.toggle('on', t === 'ann');
  if (t === 'ann') loadAnnouncements();
}

async function loadList() {
  try {
    const d = await api('/admin/support?view=' + view);
    counts = d.counts;
    $('filters').innerHTML = VIEWS.map(([k, label]) => `<button class="chip ${k === view ? 'on' : ''}" onclick="setView('${k}')">${esc(label)}${k === 'waiting' && counts.waiting ? ' (' + counts.waiting + ')' : ''}</button>`).join('');
    $('list').innerHTML = d.threads.map(t => `<div class="row ${current && current.id === t.id ? 'on' : ''}" onclick="openThread('${esc(t.id)}')">
      <b><span>${esc(t.customer?.name || 'Customer')}</span>${t.unread ? `<span class="dot">${t.unread}</span>` : ''}</b>
      <div class="pv">${esc((t.lastFrom === 'staff' ? 'You: ' : '') + t.preview)}</div>
      <div class="meta">${when(t.lastMessageAt)} · ${t.assignedTo ? esc(t.assignedTo) : 'unassigned'}${t.status === 'closed' ? ' · closed' : ''}</div></div>`).join('') || '<div class="empty">Nothing here.</div>';
  } catch (e) { msg(e.message, 'err'); }
}
function setView(v) { view = v; loadList(); }

async function openThread(id) {
  try {
    current = await api('/admin/support/' + encodeURIComponent(id));
    renderThread();
    loadList();
  } catch (e) { msg(e.message, 'err'); }
}

function renderThread() {
  const t = current;
  $('thread').innerHTML = `
    <div class="head"><div><h2>${esc(t.customer?.name || 'Customer')}</h2>
      <div class="sub" style="margin:2px 0 0">${esc(t.customer?.phone || '')} · ${esc(t.customer?.email || '')} · ${t.status}${t.assignedTo ? ' · ' + esc(t.assignedTo) : ''}</div></div>
      <div class="acts">
        <a class="btn" href="customers.html" title="Find this customer's loans" onclick="localStorage.setItem('find_customer', ${JSON.stringify(esc(t.customer?.email || ''))})">Customer page</a>
        ${t.status === 'open' ? '<button class="btn" onclick="act(\'close\')">Close</button>' : '<button class="btn" onclick="act(\'reopen\')">Reopen</button>'}
        <button class="btn" onclick="assign()">Hand over...</button>
      </div></div>
    <div class="msgs" id="msgs">${t.messages.map(m => `<div class="m ${m.from}">${esc(m.text)}<small>${esc(m.name || '')} · ${when(m.at)}</small></div>`).join('')}</div>
    ${can('support.reply') ? `<div class="reply"><textarea id="reply" maxlength="2000" placeholder="Write a reply. The customer sees it in the app and gets a notification."></textarea><button class="btn primary" onclick="sendReply()">Send</button></div>` : '<div class="sub">Your role can read messages but not reply.</div>'}`;
  const box = $('msgs'); box.scrollTop = box.scrollHeight;
}

async function sendReply() {
  const text = $('reply').value.trim();
  if (!text) return;
  const btn = document.querySelector('.reply .btn'), box = $('reply');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
  box.disabled = true;
  try { await api(`/admin/support/${current.id}/reply`, 'POST', { text }); await openThread(current.id); }
  catch (e) { msg(e.message, 'err'); if (btn) { btn.disabled = false; btn.textContent = 'Send'; } box.disabled = false; }
}
async function act(what) {
  try { await api(`/admin/support/${current.id}/${what}`, 'POST', {}); await openThread(current.id); } catch (e) { msg(e.message, 'err'); }
}
async function assign() {
  const to = prompt('Email of the staff member to hand this to (leave empty to clear):');
  if (to === null) return;
  try { await api(`/admin/support/${current.id}/assign`, 'POST', { to: to.trim() || null }); await openThread(current.id); } catch (e) { msg(e.message, 'err'); }
}

// ── Announcements ──
let AUD = {};
async function loadAnnouncements() {
  try {
    const d = await api('/admin/announcements');
    AUD = d.audiences;
    if (!$('a-aud').options.length) { $('a-aud').innerHTML = Object.entries(AUD).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join(''); countAudience(); }
    $('a-rows').innerHTML = d.announcements.map(a => `<tr><td>${when(a.at)}</td><td><b>${esc(a.title)}</b><div class="sub" style="margin:0">${esc(a.message)}</div></td><td>${esc(a.audienceLabel)}</td><td>${a.recipients}</td><td>${esc(a.sentBy)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nothing sent yet.</td></tr>';
  } catch (e) { msg(e.message, 'err'); }
}
let counted = null;
async function countAudience() {
  try { const d = await api('/admin/announcements/count?audience=' + encodeURIComponent($('a-aud').value)); counted = d.count; $('a-count').textContent = d.count + ' customer' + (d.count === 1 ? '' : 's') + ' will get this.'; $('a-push-row').style.display = d.pushAvailable ? 'flex' : 'none'; $('a-devices').textContent = d.pushAvailable ? '(' + d.devices + ' of them have the app on a phone that can receive pushes; customers who switched off offers are skipped)' : ''; } catch (e) { counted = null; $('a-count').textContent = e.message; }
}
async function sendAnnouncement() {
  const body = { audience: $('a-aud').value, title: $('a-title').value, message: $('a-msg').value, expectedCount: counted, push: $('a-push-row').style.display !== 'none' && $('a-push').checked };
  if (counted == null) return msg('Choose a group first.', 'err');
  if (!confirm(`Send this to ${counted} customer${counted === 1 ? '' : 's'}? It cannot be taken back.`)) return;
  try {
    const d = await api('/admin/announcements', 'POST', body);
    msg(`Sent to ${d.recipients} customer${d.recipients === 1 ? '' : 's'}${d.pushQueued ? ', and the push notifications are going out now' : ''}.`, 'ok');
    $('a-title').value = ''; $('a-msg').value = '';
    loadAnnouncements(); countAudience();
  } catch (e) { msg(e.message, 'err'); countAudience(); }
}

// Show only the tabs this role can use, then load.
window.addEventListener('load', () => {
  const inbox = can('support.view'), ann = can('announcements.send');
  $('tab-inbox').style.display = inbox ? '' : 'none';
  $('tab-ann').style.display = ann ? '' : 'none';
  if (!inbox && ann) showTab('ann');
  if (inbox) loadList();
  setInterval(() => { if (inbox && $('view-inbox').style.display !== 'none') loadList(); }, 30000);
});
</script>
<script src="assets/portal.js"></script>
</body>
</html>
