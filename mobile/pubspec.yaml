name: fintech_loan
description: "Instant loan application mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  dio: ^5.3.1
  provider: ^6.1.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  # Face ID / fingerprint unlock. Pinned: newer releases need a newer Android build toolchain than this app uses.
  local_auth: 2.3.0
  # The phone's location when applying (checks for many customers at one place and for faked locations). Pinned for the Android toolchain.
  geolocator: 12.0.0
  intl: ^0.19.0
  email_validator: ^2.1.17
  font_awesome_flutter: ^10.6.0
  image_picker: ^1.0.5
  url_launcher: 6.2.6
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.11.1
  # Push notifications. Pinned to releases that work with this project's Android build tools.
  firebase_core: 3.8.1
  firebase_messaging: 15.1.6

# Newer Android plugin releases need a newer Gradle toolchain than this app uses
dependency_overrides:
  url_launcher_android: 6.3.2
  local_auth_android: 1.0.43

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Poppins (SIL Open Font License, see assets/fonts/OFL.txt). Devanagari text falls back to the phone's own font.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
