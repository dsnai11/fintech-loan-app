name: fintech_loan
description: "Instant loan application mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  dio: ^5.3.1
  provider: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  email_validator: ^2.1.17
  font_awesome_flutter: ^10.6.0
  image_picker: ^1.0.5
  url_launcher: 6.2.6
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.11.1
  # Push notifications. Pinned to releases that work with this project's Android build tools.
  firebase_core: 2.32.0
  firebase_messaging: 14.9.4

# Newer Android plugin releases need a newer Gradle toolchain than this app uses
dependency_overrides:
  url_launcher_android: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
