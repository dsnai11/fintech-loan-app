<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers - LIFC Admin</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f7fa; --surface: #fcfcfb; --border: #e5e7eb;
  --text: #0b0b0b; --text-2: #52514e; --muted: #6b7280;
  --accent: #2a78d6; --header: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
  --good: #047857; --bad: #b91c1c; --warn: #b45309;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
.container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.header { background: var(--header); color: #fff; padding: 24px; border-radius: 12px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; }
.header h1 { font-size: 26px; } .header p { font-size: 13px; opacity: .9; margin-top: 4px; }
.nav { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.nav a { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; } .nav a:hover { text-decoration: underline; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.alert { display: none; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; background: #fee2e2; color: #991b1b; }
.alert.show { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin-bottom: 10px; }
input[type=text] { flex: 1; min-width: 200px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr.pick { cursor: pointer; } tr.pick:hover { background: rgba(42, 120, 214, .08); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 20px; font-size: 14px; }
.kv b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--border); }
.pill.good { background: rgba(4, 120, 87, .15); color: var(--good); } .pill.bad { background: rgba(185, 28, 28, .15); color: var(--bad); } .pill.warn { background: rgba(180, 83, 9, .15); color: var(--warn); }
.muted { color: var(--muted); font-size: 12px; }
a.link { color: var(--accent); cursor: pointer; }
</style>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-shell="app">
<div class="container">
  <div class="header">
    <div><h1>Customers</h1><p>Everything about one customer in one place</p></div>
    <div class="nav">
      <a href="loan-management.html">Loan Management</a>
      <a href="staff.html">Staff</a>
      <a href="collections.html">Collections</a>
      <a href="analytics.html">Analytics</a>
      <a href="compliance.html">Compliance</a>
      <a href="pricing.html">Pricing</a>
      <a href="admin-config.html">Configuration</a>
    </div>
  </div>

  <div id="alert" class="alert" role="alert"></div>

  <div class="card">
    <h2>Find a customer</h2>
    <form class="row" onsubmit="search(event)">
      <input type="text" id="q" placeholder="Name, email, phone or PAN" autocomplete="off">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div id="results" style="margin-top:12px"></div>
  </div>

  <div id="detail"></div>
</div>

<script>
const API = (location.protocol === 'file:' ? 'https://fintech-loan-app-production.up.railway.app' : location.port === '3000' ? 'http://localhost:5000' : location.origin) + '/api';
const token = localStorage.getItem('admin_token');
if (!token) location.href = 'admin-config.html';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => 'Rs ' + Math.round(n || 0).toLocaleString('en-IN');
const date = d => d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const tone = s => ({ approved: 'good', active: 'good', closed: 'good', CLEARED: 'good', rejected: 'bad', blocked: 'bad', defaulted: 'bad', written_off: 'bad', HIGH: 'bad', OPEN: 'warn', pending: 'warn', MEDIUM: 'warn' }[s] || '');
const pill = s => `<span class="pill ${tone(s)}">${esc(s)}</span>`;

function fail(msg) { const a = $('alert'); a.textContent = msg; a.classList.add('show'); }
async function api(path) {
  $('alert').classList.remove('show');
  const r = await fetch(API + path, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) { localStorage.removeItem('admin_token'); location.href = 'admin-config.html'; throw new Error('Session expired'); }
  if (r.status === 403) { const m = (await r.clone().json().catch(() => ({}))).error; throw new Error(m || 'You do not have permission to do this'); }
  return r;
}

async function search(e) {
  e.preventDefault();
  try {
    const r = await api('/admin/customers?q=' + encodeURIComponent($('q').value));
    const d = await r.json();
    if (!r.ok) return fail(d.error || 'Search failed');
    $('results').innerHTML = d.customers.length
      ? `<div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>KYC</th><th>Account</th><th>Joined</th></tr></thead><tbody>${d.customers.map(c =>
        `<tr class="pick" onclick="openCustomer('${esc(c.id)}')"><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${pill(c.kycStatus)}</td><td>${pill(c.status)}</td><td>${date(c.joined)}</td></tr>`).join('')}</tbody></table></div>`
      : '<span class="muted">No customer matches that search.</span>';
  } catch (err) { fail(err.message); }
}

async function openCustomer(id) {
  try {
    const r = await api('/admin/customers/' + encodeURIComponent(id));
    const d = await r.json();
    if (!r.ok) return fail(d.error || 'Could not load the customer');
    const c = d.customer, s = d.summary;
    const canMsg = !window.PortalShell || PortalShell.can('support.reply');
    $('detail').innerHTML = `
      <div class="card"><h2>${esc(c.name)} ${pill(c.kycStatus)} ${pill(c.status)}</h2>
        <div class="kv">
          <div><b>Email</b>${esc(c.email)}</div><div><b>Phone</b>${esc(c.phone)}</div><div><b>PAN</b>${esc(c.pan || '-')}</div>
          <div><b>Bank account</b>${c.bankAccount ? esc(c.bankAccount.holder + ', ' + c.bankAccount.number + ', ' + c.bankAccount.ifsc) : '-'}</div>
          <div><b>Joined</b>${date(c.joined)}</div><div><b>Admin 2FA</b>${c.twoFactorEnabled ? 'On' : 'Off'}</div>
        </div></div>
      ${canMsg ? `<div class="card"><h2>Send a message</h2><div class="muted" style="margin-bottom:8px">${esc(c.name)} sees it in the app and gets a notification. Replies come to the Messages inbox.</div><div class="row"><input type="text" id="dm" maxlength="2000" placeholder="Write a message"><button class="btn primary" onclick="sendMessage('${esc(c.id)}')">Send</button></div></div>` : ''}
      <div class="card"><h2>Summary</h2><div class="kv">
        <div><b>Loans</b>${s.totalLoans}</div><div><b>Active</b>${s.activeLoans}</div><div><b>Total borrowed</b>${inr(s.totalBorrowed)}</div><div><b>Open AML alerts</b>${s.openAlerts}</div></div></div>
      ${setupCard(c)}
      <div class="card"><h2>Loans</h2>${table(['Amount', 'Tenure', 'EMI', 'Status', 'Applied', 'Paid out', ''], d.loans.map(l =>
        [inr(l.amount), l.tenure + ' mo', inr(l.emi), pill(l.status), date(l.appliedAt), date(l.disbursedAt),
          ['disbursed', 'closed'].includes(l.status) ? `<a class="link" onclick="openDoc('${esc(l.id)}','statement')">Statement</a>` : ''
          + (l.status === 'closed' ? ` <a class="link" onclick="openDoc('${esc(l.id)}','closure-letter')">Closure letter</a>` : '')]))}</div>
      <div class="card"><h2>AML alerts</h2>${table(['Rule', 'Severity', 'Status', 'Detail', 'Raised'], d.alerts.map(a => [esc(a.rule), pill(a.severity), pill(a.status), esc(a.detail), date(a.at)]))}</div>
      <div class="card"><h2>Collection history</h2>${table(['When', 'Type', 'Note', 'Promise', 'By'], d.collectionHistory.map(n =>
        [date(n.at), esc(n.type), esc(n.text), n.promiseDate ? date(n.promiseDate) + (n.promiseAmount ? ' / ' + inr(n.promiseAmount) : '') : '', esc(n.by)]))}</div>
      <div class="card"><h2>Data requests</h2>${table(['Type', 'Status', 'Raised'], d.dataRequests.map(q => [esc(q.type), pill(q.status), date(q.at)]))}</div>`;
    $('detail').scrollIntoView({ behavior: 'smooth' });
    if (c.selfie && (!window.PortalShell || PortalShell.can('kyc.view'))) loadSelfie(c.id);
  } catch (err) { fail(err.message); }
}

async function sendMessage(userId) {
  const text = $('dm').value.trim();
  if (!text) return;
  try {
    const r = await fetch(API + '/admin/support/start', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ userId, text }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return fail(d.error || 'Could not send');
    $('dm').value = '';
    $('alert').textContent = 'Message sent. Replies will appear in Messages.'; $('alert').className = 'alert show ok';
  } catch (err) { fail(err.message); }
}

// open straight from the Messages inbox
const pre = (() => { try { const v = localStorage.getItem('find_customer'); localStorage.removeItem('find_customer'); return v; } catch (e) { return null; } })();
if (pre) { document.addEventListener('DOMContentLoaded', () => { $('q').value = pre; search(new Event('submit')); }); }

// Identity (DigiLocker), personal details, the selfie and the bank account, for the KYC review
const FLAGS = { name_differs: 'Name differs from the account', date_of_birth_differs: 'Date of birth differs', pan_differs: 'PAN differs from the account', pan_on_another_account: 'PAN is on another account', same_aadhaar_on_another_account: 'Same Aadhaar on another account', no_date_of_birth: 'No date of birth returned', same_photo_on_another_account: 'Same photo on another account' };
const yn = v => (v === true ? 'Matches' : v === false ? 'Does not match' : 'Not compared');
function setupCard(c) {
  const d = c.digilocker, s = c.selfie, a = c.address, e = c.employment, ic = c.incomeCheck;
  const steps = c.setup || {};
  const decide = !window.PortalShell || PortalShell.can('kyc.decide');
  const flagList = list => (list || []).map(f => `<div class="muted">! ${esc(FLAGS[f] || f)}</div>`).join('');
  return `<div class="card"><h2>Account set-up ${steps.complete ? pill('approved') : '<span class="pill warn">not finished</span>'}</h2>
    <div class="kv" style="margin-bottom:14px">
      <div><b>Identity (DigiLocker)</b>${d ? `${pill(d.status === 'verified' ? 'approved' : 'pending')} ${d.mode === 'sandbox' ? '<span class="muted">test mode</span>' : ''}<div class="muted">Name: ${yn(d.nameMatch)} · Date of birth: ${yn(d.dobMatch)}${d.aadhaarLast4 ? ' · Aadhaar ends ' + esc(d.aadhaarLast4) : ''}</div>${flagList(d.flags)}` : '<span class="muted">Not done</span>'}</div>
      <div><b>Personal details</b>${steps.profile ? `${esc(c.gender)}, born ${date(c.dateOfBirth)}<div class="muted">${a ? esc([a.street, a.city, a.state, a.zipCode].filter(Boolean).join(', ')) : ''}</div><div class="muted">${e ? esc(e.status || '') + (e.company ? ', ' + esc(e.company) : '') + (e.monthlyIncome ? ', ' + inr(e.monthlyIncome) + ' a month' : '') : ''}</div>` : '<span class="muted">Not done</span>'}</div>
      <div><b>Bank account</b>${c.bankAccount ? esc(c.bankAccount.holder + ', ' + c.bankAccount.number + ', ' + c.bankAccount.ifsc) : '<span class="muted">Not done</span>'}</div>
    </div>
    <div style="margin-bottom:14px"><b style="font-size:11px;color:var(--muted);text-transform:uppercase">Income check (bank statements)</b>
      ${ic ? `<div style="margin-top:6px">${ic.mode === 'sandbox' ? '<span class="pill warn">test data</span> ' : ''}${ic.stale ? '<span class="pill warn">older than 90 days</span> ' : ''}${ic.salaryDetected ? `Salary of about <b>${inr(ic.estimatedMonthlyIncome)}</b> a month (seen in ${ic.incomeStabilityPercent}% of months)` : `<b>No regular salary seen.</b> Average money in: ${inr(ic.avgMonthlyCredits)} a month`}
        <div class="muted">${ic.months} months, ${esc(ic.from)} to ${esc(ic.to)}${ic.bank ? ' · ' + esc(ic.bank) : ''} · checked ${date(ic.at)}</div>
        <div class="muted">Loan repayments seen: ${inr(ic.monthlyObligations)} a month · Bounced payments: ${ic.bounces}${ic.avgBalance != null ? ' · Average balance ' + inr(ic.avgBalance) + ' (lowest ' + inr(ic.minBalance) + ')' : ''}${ic.lowBalancePercent ? ' · Under Rs 1,000 on ' + ic.lowBalancePercent + '% of entries' : ''}</div>
        ${e && e.monthlyIncome && ic.estimatedMonthlyIncome ? `<div class="muted">Declared income: ${inr(e.monthlyIncome)} a month</div>` : ''}</div>` : '<div class="muted" style="margin-top:6px">The customer has not shared their bank statements</div>'}</div>
    <b style="font-size:11px;color:var(--muted);text-transform:uppercase">Photo and blink check</b>
    ${s ? `<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-top:8px">
        <div><img id="selfie-before" alt="Photo before the blinks" style="width:150px;height:200px;object-fit:cover;border-radius:10px;background:#e5e7eb"><div class="muted">Before</div></div>
        <div><img id="selfie-after" alt="Photo after the blinks" style="width:150px;height:200px;object-fit:cover;border-radius:10px;background:#e5e7eb"><div class="muted">After two blinks</div></div>
        <div style="flex:1;min-width:220px">${pill(s.status === 'passed' ? 'approved' : s.status === 'rejected' ? 'rejected' : 'pending')} <span class="muted">taken ${date(s.capturedAt)} · ${s.blinks} blinks seen by the phone</span>${flagList(s.flag ? [s.flag] : [])}
          ${s.reviewedBy ? `<div class="muted">Reviewed by ${esc(s.reviewedBy)}${s.reviewNote ? ': ' + esc(s.reviewNote) : ''}</div>` : ''}
          <div class="muted" style="margin-top:6px">Compare the two photos with the person on the Aadhaar record. The blink check runs on the phone, so look at the photos too.</div>
          ${decide ? `<div style="margin-top:10px;display:flex;gap:8px"><button class="btn primary" onclick="selfieDecision('${esc(c.id)}','accept')">Accept photo</button><button class="btn" onclick="selfieDecision('${esc(c.id)}','reject')">Ask them to retake</button></div>` : ''}
        </div></div>` : '<div class="muted" style="margin-top:6px">No photo yet</div>'}</div>`;
}
async function loadSelfie(id) {
  for (const frame of ['before', 'after']) {
    try {
      const r = await fetch(API + `/admin/customers/${encodeURIComponent(id)}/selfie?frame=${frame}`, { headers: { Authorization: 'Bearer ' + token } });
      if (r.ok && $('selfie-' + frame)) $('selfie-' + frame).src = URL.createObjectURL(await r.blob());
    } catch (e) { /* the image stays grey */ }
  }
}
async function selfieDecision(id, decision) {
  let note = '';
  if (decision === 'reject') { note = prompt('Why should they retake it? The customer will see this.') || ''; if (!note.trim()) return; }
  else note = prompt('Note (optional):') || '';
  try {
    const r = await fetch(API + `/admin/customers/${encodeURIComponent(id)}/selfie-decision`, { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ decision, note }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return fail(d.error || 'Could not save');
    openCustomer(id);
  } catch (err) { fail(err.message); }
}

// cells are already escaped or built from escaped parts above
function table(heads, rows) {
  if (!rows.length) return '<span class="muted">Nothing yet.</span>';
  return `<div class="scroll"><table><thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

async function openDoc(loanId, doc) {
  const w = window.open('', '_blank');
  try {
    const r = await api(`/loans/${encodeURIComponent(loanId)}/${doc}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not open the document');
    if (w) w.location = URL.createObjectURL(await r.blob());
  } catch (err) { if (w) w.close(); fail(err.message); }
}
</script>
<script src="assets/portal.js"></script>
</body>
</html>
