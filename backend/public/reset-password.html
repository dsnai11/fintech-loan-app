<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Choose a new password - LIFC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F9FAFB; color: #111827; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
.card { background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; padding: 28px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
h1 { font-size: 20px; color: #0F1C2E; margin-bottom: 6px; }
p { color: #6B7280; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
label { display: block; font-size: 12px; font-weight: 600; color: #6B7280; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
input { width: 100%; padding: 10px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #16A34A; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
button:disabled { opacity: .6; cursor: not-allowed; }
.msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
.msg.ok { display: block; background: #D1FAE5; color: #065F46; }
.msg.err { display: block; background: #FEE2E2; color: #991B1B; }
a { color: #16A34A; font-size: 13px; text-decoration: none; display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Choose a new password</h1>
  <p>Use at least 8 characters. After saving, sign in with the new password. You will be signed out of other devices.</p>
  <label for="pw">New password</label>
  <input type="password" id="pw" autocomplete="new-password" minlength="8" maxlength="128" required>
  <label for="pw2">Repeat new password</label>
  <input type="password" id="pw2" autocomplete="new-password" minlength="8" maxlength="128" required>
  <button type="submit" id="btn">Save new password</button>
  <div id="msg" class="msg" role="status"></div>
  <a href="/">Go to sign in</a>
</form>
<script>
const API = (location.protocol === 'file:' ? 'https://fintech-loan-app-production.up.railway.app' : location.port === '3000' ? 'http://localhost:5000' : location.origin) + '/api';
const token = new URLSearchParams(location.search).get('token') || '';
const msg = document.getElementById('msg');
if (!/^[a-f0-9]{64}$/.test(token)) {
  msg.textContent = 'This link is not valid. Ask for a new one.'; msg.className = 'msg err';
  document.getElementById('btn').disabled = true;
}
// Keep the one-time token out of the address bar and browser history once the page has read it.
history.replaceState(null, '', location.pathname);

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (pw !== document.getElementById('pw2').value) { msg.textContent = 'The two passwords do not match.'; msg.className = 'msg err'; return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; msg.className = 'msg';
  try {
    const r = await fetch(API + '/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: pw }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Something went wrong');
    msg.textContent = d.message; msg.className = 'msg ok';
    document.getElementById('f').querySelectorAll('input').forEach(i => i.disabled = true);
    return;
  } catch (err) { msg.textContent = err.message; msg.className = 'msg err'; }
  btn.disabled = false;
});
</script>
</body>
</html>
